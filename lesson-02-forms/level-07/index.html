<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Lesson 02 — Level 07</title>
  </head>
  <body>
    <h1>Level 07 — Labels & Accessibility</h1>
    <!-- TODO: Attach labels to controls. Use <label for="id"> or wrap the input inside <label>. -->
    <form>
      <label for="good-rating">Good:</label>
      <input id="good-rating" type="radio" name="rating" />

      <label for="bad-rating">Bad</label>
      <input id="bad-rating" type="radio" name="rating" />

      <br />

      <label for="friday-show">Did you watch the show on Friday?</label>
      <input id="friday-show" type="checkbox" />

      <br />

      <label for="saturday-show">Did you watch the show on Saturday?</label>
      <input id="saturday-show" type="checkbox" />
      <br />
      <button type="submit">Submit rating</button>
    </form>
  </body>
</html>
